# M1 Track A reproducible-run configuration, per CLAUDE.md Sec 1.3
# ("Every headline result must reproduce via a single command").
#
# This config records the LOCKED values already frozen across the gate
# documents -- it does not introduce any new number. Every value here
# traces to one of: m1-notation-gate.md, m1-0-implementation-lock.md,
# results/m1_circuit_params.json, or data/poly_coeffs_v1.json.

data:
  mimic_root: "../module2/mimic4ed-benchmark-main"  # resolved by src/mimic_paths.py
  cohort_path: "data/m1_cohort.parquet"
  features_path: "data/m1_features.parquet"
  atc_crosswalk_path: "data/atc_crosswalk.json"

split:
  # splits.py::SPLIT_SEED / TRAIN_FRACTION / VAL_FRACTION -- patient-level,
  # identical across all 5 model seeds.
  seed: 42
  train_fraction: 0.6
  val_fraction: 0.2
  test_fraction: 0.2

model:
  # Track A mandatory-core XGBoost config (Roadmap PDF Sec M1 / CLAUDE.md).
  n_estimators: 50
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  base_score: 0.5  # LOCKED: fixes the xgboost>=2.0 vs Concrete-ML xgboost==1.6.2 base_score mismatch
  seeds: [42, 123, 7, 456, 789]  # splits.py::MODEL_SEEDS

circuit:
  # m1-0-implementation-lock.md Sec 1-6, Amendment v1.1 (Sec 15) and v1.2 (Sec 16).
  k_values: [3, 5, 7, 9]  # notation.py::K_APPROX_DEGREE_VALUES
  k_mandatory_core: 5  # notation.py::K_MANDATORY_CORE_DEGREE
  approximation_interval_a: 0.847059  # results/m1_circuit_params.json
  branch_smoothing_function: "sigmoid-transformed step (soft_step)"
  gamma_anchor_percentile: 75  # v1.2 correction; v1 used 99.9 and was flat in k (superseded)
  poly_coeffs_version: "v2"  # data/poly_coeffs_v1.json ["version"]
  tree_depth: 6
  packing: "leaf-aligned, one ciphertext per tree level (Amendment Sec 15.2)"

ckks:
  # m1-0-implementation-lock.md Sec 5, confirmed via
  # src/verify_ckks_security_level.py / results/m1_security_level_verification.json.
  N_poly_modulus_degree: 16384  # notation.py::N_POLY_MODULUS_DEGREE
  coeff_modulus_bit_sizes: [60, 40, 40, 40, 40, 40, 40, 40, 60]
  scale_bits: 40
  security_level_bits: 128  # notation.py::LAM_SECURITY_LEVEL, TC128-confirmed, fails TC192

tfhe:
  # m1-0-implementation-lock.md Sec 10 freeze list.
  n_bits: 6
  execution_mode: "execute"  # never "simulate", per the freeze list

evaluation:
  utility_tolerance_delta_f1: 0.03  # notation.py::MAX_ACCEPTABLE_F1_LOSS
  bootstrap_resamples: 2000
  bootstrap_seed: 42
  encrypted_subsample_n: 500
  encrypted_subsample_seed: 42
  encrypted_subsample_strategy: "stratified by joint 5-label prevalence"
  latency_warmup_reps: 5
  latency_timed_reps: 20

gates:
  m1_n_status: "APPROVED by the supervisor 2026-09-21 (direct; see m1-notation-gate.md). Earlier 2026-09-18 record was chat-relayed."
  m1_0_status: "APPROVED FOR CONTINUATION by the supervisor 2026-09-21, conditional on closure of the guide items (see m1-0-implementation-lock.md sign-off section and M1_CLOSURE_LOG.md)"
  m1_a_status: "PASS (results/m1_gate_a_report.json, after Amendment v1.2 correction)"

# Closure phase (M1_CLOSURE_LOG.md; supervisor guide 21 Sep 2026). Documentation mirror ONLY -- stage scripts read their own frozen artifacts.
closure:
  gamma_anchor_selection:
    artifact: results/m1_gamma_anchor_selection.json   # generate_poly_coefficients.py READS the anchor from here; there is no literal
    preregistration: docs/anchor_reselection_preregistration.md
    scoring_split: validation
    scoring_degree_k: 5
    candidates_percentile: [50, 75, 90, 95, 99.9]
    tie_tolerance_agreement: 0.002
  real_ckks_multiseed:
    protocol: docs/real_ckks_multiseed_protocol.md
    seeds: [42, 123, 7, 456, 789]
    label: label_hypertension_uncomplicated   # the same label for every seed
    k_values: [3, 5, 7]                       # k=9 excluded: code-derived depth 8 > 7 levels (m1-0-implementation-lock.md sec 18)
    n_per_seed: 25
    stratification: "plaintext predicted class, 12 positive + 13 negative"
    sampling_subseed: 20260921
  latency:
    seed_model: 42
    warmup_evaluations: 5
    timed_evaluations: 20
    process_per_k: true
  scaling_multiseed:
    seeds: [42, 123, 7, 456, 789]
    k: 5
    latency_patients_per_config: 10
  lwe_estimate:
    estimator_commit: 53da5982597709ba0fdf94ea37a84d822310fd84
    cost_models: [ADPS16-classical-core-SVP, MATZOV]
    interpretation_rule: results/m1_lwe_security_summary.json   # which model may be compared with 128 bits
